[package]
name = "sepal"
version = "0.2.0-alpha.0"
edition = "2024"
description = "Runs a Svelte app compiled for the Sepal renderer in a native window"
license = "MIT"
repository = "https://github.com/etherCorps/sepal"
# Shipped as prebuilt binaries through npm, not through crates.io.
publish = false

[dependencies]
blitz-dom = { version = "=0.3.0-beta.4", features = ["scrollbars"] }
blitz-traits = "=0.3.0-beta.4"
# The page: `index.html`. blitz-html's tree builder, driven by html5ever
# directly, which leaves out its XHTML sniffing and xml5ever (+0.7 MB in all).
blitz-html = "=0.3.0-beta.4"
html5ever = "0.40.1"
rquickjs = { version = "0.14", features = ["array-buffer", "loader"] }
# A second engine, behind the `engine-v8` feature. See `src/js/v8.rs`.
v8 = { version = "152", optional = true }
keyboard-types = "0.8"
# `image` and `data-url` are already in the tree through blitz-dom.
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
data-url = "0.3"

# Updater: fetch the feed and the archive, check the signature, unpack.
# `flate2`, `semver`, `base64` and `getrandom` are already in the tree.
ureq = "3"
ed25519-dalek = "3"
tar = { version = "0.4", default-features = false }
flate2 = "1"
semver = "1"
base64 = "0.23"
getrandom = "0.4"

# Native dialogs. Already in the tree through blitz-shell, with these features.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# window
blitz-shell = { version = "=0.3.0-beta.4", optional = true }
anyrender_vello_hybrid = { version = "0.11", optional = true }
# Same pin as blitz-shell. Needed directly for window attributes and to wrap
# the application handler.
winit = { version = "=0.31.0-beta.3", optional = true }

# headless screenshots (CPU rasteriser, no GPU or display needed)
blitz-paint = { version = "=0.3.0-beta.4", optional = true, features = ["scrollbars"] }
anyrender = { version = "0.14", optional = true }
anyrender_vello_cpu = { version = "0.18", optional = true }
png = { version = "0.18", optional = true }

# Process memory and CPU time for the performance overlay (`src/hud.rs`).
# Already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Dock icon of an unbundled binary can only be set through AppKit.
# Versions match the ones winit already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "NSBundle",
    "NSData",
    "NSProcessInfo",
    "NSString",
] }

[features]
default = ["window"]
window = [
    "dep:blitz-shell",
    "dep:anyrender_vello_hybrid",
    # blitz-shell takes blitz-paint without features; without this the window
    # draws no inline SVG and no scrollbars (only `screenshot` builds did).
    "dep:blitz-paint",
    "dep:winit",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]
screenshot = ["dep:blitz-paint", "dep:anyrender", "dep:anyrender_vello_cpu", "dep:png"]
# Run the app in V8 (with its JIT) instead of QuickJS. Bigger binary, faster
# JavaScript. Experimental.
engine-v8 = ["dep:v8"]

# The prebuilt host is named calyx; the library stays `sepal` for tests and examples.
[[bin]]
name = "calyx"
path = "src/main.rs"

[[example]]
name = "drive"
required-features = ["screenshot"]

# Thirteen small changes; see crates/blitz-dom/PATCH.md.
[patch.crates-io]
blitz-dom = { path = "../blitz-dom" }
# Glyph atlas on with small pages, large images, drawing without a window; see its PATCH.md.
anyrender_vello_hybrid = { path = "../anyrender_vello_hybrid" }
# Layer textures that shrink again; see its PATCH.md.
vello_gpu = { path = "../vello_gpu" }
# Clears and uploads in render passes, not blits; see its PATCH.md.
wgpu-hal = { path = "../wgpu-hal" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
# The binary ships through npm; symbols are a third of its size.
strip = true

# What ships (`pnpm run build:host`, release.yml) and what compare/ measures:
# release, with the whole program optimised as one unit. About a quarter
# smaller than release (linux-x64 33.5 -> 25.4 MB, under the 30,000,000-byte
# budget on every platform) and as fast in the headless bench, but a cold
# build takes two to three times as long, so plain --release keeps thin LTO.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
