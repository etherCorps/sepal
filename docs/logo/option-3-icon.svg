<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<!-- Two charges: the upper lobe in Svelte orange, the lower in electric yellow, and a lightning-shaped gap where they meet. App icon. -->
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#292524" />
			<stop offset="1" stop-color="#0c0a09" />
		</linearGradient>
	</defs>
	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" />
	<g transform="translate(512 512) scale(0.74) translate(-512 -512)">
	<defs>
		<linearGradient id="hot" gradientUnits="userSpaceOnUse" x1="300" y1="250" x2="560" y2="640">
			<stop offset="0" stop-color="#ff7a3d" />
			<stop offset="1" stop-color="#ff3e00" />
		</linearGradient>
		<linearGradient id="volt" gradientUnits="userSpaceOnUse" x1="470" y1="420" x2="720" y2="800">
			<stop offset="0" stop-color="#ffd43b" />
			<stop offset="1" stop-color="#ff9a00" />
		</linearGradient>
		<clipPath id="lower"><path d="M949 150 516 400 462 536h100L508 624 75 874V1500H1500V150z" /></clipPath>
		<mask id="seam">
			<rect x="-400" y="-400" width="1900" height="1900" fill="#fff" />
			<path d="M520 392 462 536h100L504 632" fill="none" stroke="#000" stroke-width="34" stroke-linejoin="miter" stroke-miterlimit="12" />
		</mask>
	</defs>
	<g mask="url(#seam)" fill="none" stroke-width="190" stroke-linecap="round">
		<path d="M664 322H452a95 95 0 0 0 0 190h120a95 95 0 0 1 0 190H360" stroke="url(#hot)" transform="rotate(-30 512 512)" />
		<g clip-path="url(#lower)">
			<path d="M400 512h172a95 95 0 0 1 0 190H360" stroke="url(#volt)" transform="rotate(-30 512 512)" />
		</g>
	</g>
	</g>
</svg>
