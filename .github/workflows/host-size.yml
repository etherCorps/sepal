# The host a pull request would ship, against the 30,000,000-byte budget,
# when it changes the host's dependencies (a Cargo.toml or Cargo.lock): new
# crates and features are what move the size. A dist build on every pull
# request would cost too much CI time; release.yml checks every release.
name: Host size

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'

permissions:
  contents: read

jobs:
  size:
    name: host size (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The release's runners (release.yml, `host`).
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          - { os: ubuntu-22.04, platform: linux-x64-gnu }
          - { os: ubuntu-22.04-arm, platform: linux-arm64-gnu }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: dist
          node: 'false'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # As `pnpm run build:host` builds it (scripts/build-host-package.js).
      - run: cargo build --profile dist --features screenshot --manifest-path crates/host/Cargo.toml
      - run: node scripts/host-size.js crates/host/target/dist/calyx ${{ matrix.platform }}
