name: Release

# Builds the host on every platform it ships for, each into its own platform
# package (packages/calyx-<platform>), and packs all seven packages.
#
# Started by hand (Actions -> Release -> Run workflow) it stops there: the
# tarballs are attached to the run, to look at or to install from, and
# nothing is published; the run prints what publishing would do. Pushing a
# `v<version>` tag publishes them to npm with scripts/publish.js, which needs
# the `NPM_TOKEN` secret.
#
# Dist-tags (scripts/publish.js): a stable release is `latest`. A prerelease
# goes out under its own tag (`0.1.0-alpha.1` as `alpha`) and, until sepal has
# a stable release, also moves `latest`, on every package. Once a stable
# release exists, prereleases leave `latest` alone.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  host:
    name: host (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          # The oldest Ubuntu there is a runner for: a binary runs on the
          # glibc it was built against and anything newer.
          - { os: ubuntu-22.04, platform: linux-x64-gnu }
          - { os: ubuntu-22.04-arm, platform: linux-arm64-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:host
      # The path a user without Rust takes, with the binary just built: both
      # starters created from the packed packages, built and rendered.
      - run: pnpm run test:template
      - name: The binary is where its platform package ships it
        shell: bash
        run: test -s packages/calyx-${{ matrix.platform }}/bin/calyx
      - uses: actions/upload-artifact@v4
        with:
          # Named after the package's directory, so the pack job unpacks it there.
          name: calyx-${{ matrix.platform }}
          path: |
            packages/calyx-${{ matrix.platform }}/bin
            packages/calyx-${{ matrix.platform }}/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  pack:
    name: pack${{ startsWith(github.ref, 'refs/tags/v') && ' and publish' || '' }}
    needs: host
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For npm to record which run built the packages.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the packages' version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./packages/sepal/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, but the packages are at $version"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Also emits each package's types (`prepare`).
      - run: pnpm install --frozen-lockfile
      # One artifact per platform, each unpacked into packages/<its name>.
      - uses: actions/download-artifact@v4
        with:
          pattern: calyx-*
          path: packages
      - name: Every platform package has its binary and licences
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            test -s packages/calyx-$platform/bin/calyx || { echo "::error::no binary in packages/calyx-$platform"; exit 1; }
            test -s packages/calyx-$platform/THIRD-PARTY-LICENSES.txt || { echo "::error::no licences in packages/calyx-$platform"; exit 1; }
          done
          # Artifacts do not keep the executable bit.
          chmod +x packages/calyx-*/bin/calyx
          ls -l packages/calyx-*/bin
      - name: Pack
        run: |
          mkdir packs
          pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$PWD/packs"
          ls -l packs
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packs
      # What a tag would publish, and under which dist-tags. Reads the
      # registry, writes nothing.
      - name: Publish (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/publish.js packs --dry-run
      # The tarballs that were just packed, not a second build of them:
      # platform packages first, each stage only once the last one's tarballs
      # download, anything already at this version skipped, so a failed run
      # can be repeated. The dist-tag rule is at the top of this file.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: node scripts/publish.js packs
