name: Release

# A commit on main whose version (packages/sepal/package.json) is not on npm
# yet is released: tested, built on every platform, published to npm, tagged
# v<version>, and given a GitHub Release. Nothing else publishes; every other
# push to main stops at the first job.
#
# To release:
#
#   pnpm release prerelease      (or patch, minor, or an exact version)
#   git push origin main
#
# `pnpm release` sets every package and the host crate to the new version,
# files CHANGELOG.md's "Unreleased" section under it, and commits "Release
# <version>". A version with no CHANGELOG section fails before anything is
# built.
#
# Run by hand (Actions -> Release -> Run workflow), on any branch, it is a dry
# run: it tests, builds and packs, and prints what publishing would do.
#
# Publishing is npm trusted publishing (OIDC): no token, here or in the
# repository's secrets. One-time setup, done by Shivam: a GitHub environment
# named `npm`, and every package trusting this file from it:
#
#   for p in sepal create-sepal @ethercorps/calyx \
#     @ethercorps/calyx-darwin-arm64 @ethercorps/calyx-darwin-x64 \
#     @ethercorps/calyx-linux-x64-gnu @ethercorps/calyx-linux-arm64-gnu; do
#     npm trust github "$p" --file release.yml --repo etherCorps/sepal --env npm --allow-publish
#   done
#
# then, on npmjs.com, each package's trusted publisher with "Allow npm
# dist-tag" turned on: `npm trust` has no flag for it, and without it npm
# publishes but refuses to move `latest` ("This trusted publisher cannot
# manage dist-tags").
#
# npm trusts a package that exists, so a brand-new one (a Windows calyx,
# sepal-secrets) is published once by hand, then trusted, before this can
# publish it.
#
# A failed release is finished by re-running it: what is already on npm,
# tagged or released is skipped. Once sepal is on npm a new push no longer
# retries, so re-run the failed run instead.
#
# Dist-tags (scripts/publish.js): a stable release is `latest`. A prerelease
# goes out under its own tag (`0.1.0-alpha.2` as `alpha`) and, until sepal has
# a stable release, also moves `latest`, on every package. Once a stable
# release exists, prereleases leave `latest` alone.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A release in progress is never cancelled; a later
# push waits for it, and then finds its version on npm.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      # No pnpm here, so setup-node must not cache for the `packageManager` in package.json.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Is this version on npm yet?
        id: check
        run: |
          version=$(node -p "require('./packages/sepal/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # An existing package without this version prints nothing; a missing package is E404.
          if out=$(npm view "sepal@$version" version 2>&1); then
            if [ "$out" = "$version" ]; then on_npm=true; else on_npm=false; fi
          elif printf '%s' "$out" | grep -q E404; then
            on_npm=false
          else
            echo "::error::cannot ask npm about sepal@$version: $out"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Dry run of $version (on npm already: $on_npm)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$on_npm" = true ]; then
            echo "sepal@$version is on npm: nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "sepal@$version is not on npm: releasing it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: CHANGELOG.md has a section for it
        if: steps.check.outputs.run == 'true'
        run: node scripts/release.js notes "${{ steps.check.outputs.version }}" > /dev/null
      - name: Every package and the host crate are at it
        if: steps.check.outputs.run == 'true'
        run: node scripts/check-versions.js

  # What ci.yml runs, again here: a commit whose tests fail is not published.
  test:
    name: test (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  engine-v8:
    name: host tests on V8
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: v8
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: cargo test --manifest-path crates/host/Cargo.toml --features "screenshot engine-v8"

  host:
    name: host (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    # A cold dist build is up to 14 minutes (the Intel Mac), and the template test follows.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          # The oldest Ubuntu there is a runner for: a binary runs on the
          # glibc it was built against and anything newer.
          - { os: ubuntu-22.04, platform: linux-x64-gnu }
          - { os: ubuntu-22.04-arm, platform: linux-arm64-gnu }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:host
      # Every platform's host has a budget of 30,000,000 bytes: its size goes
      # in the job summary, and the release stops above it.
      - name: The binary is within its size budget
        shell: bash
        run: node scripts/host-size.js packages/calyx-${{ matrix.platform }}/bin/calyx ${{ matrix.platform }}
      # The path a user without Rust takes, with the binary just built: both
      # starters created from the packed packages, built and rendered.
      - run: pnpm run test:template
      - name: The binary is where its platform package ships it, at this version
        shell: bash
        run: |
          test -s packages/calyx-${{ matrix.platform }}/bin/calyx
          test "$(packages/calyx-${{ matrix.platform }}/bin/calyx --version)" = "calyx ${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v6
        with:
          # Named after the package's directory, so the pack job unpacks it there.
          name: calyx-${{ matrix.platform }}
          path: |
            packages/calyx-${{ matrix.platform }}/bin
            packages/calyx-${{ matrix.platform }}/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  # Runs when the jobs it needs ran and passed; skipped with them otherwise.
  pack:
    name: pack
    needs: [version, test, engine-v8, host]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Also emits each package's types (`prepare`).
      - run: pnpm install --frozen-lockfile
      # One artifact per platform, each unpacked into packages/<its name>.
      - uses: actions/download-artifact@v7
        with:
          pattern: calyx-*
          path: packages
      - name: Every platform package has its binary and licences
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            test -s "packages/calyx-$platform/bin/calyx" || { echo "::error::no binary in packages/calyx-$platform"; exit 1; }
            test -s "packages/calyx-$platform/THIRD-PARTY-LICENSES.txt" || { echo "::error::no licences in packages/calyx-$platform"; exit 1; }
          done
          # Artifacts do not keep the executable bit.
          chmod +x packages/calyx-*/bin/calyx
          ls -l packages/calyx-*/bin
      - name: Pack
        run: |
          mkdir packs
          pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$PWD/packs"
          ls -l packs
      - uses: actions/upload-artifact@v6
        with:
          name: packages
          path: packs
          if-no-files-found: error
      # What publishing would do, and under which dist-tags. Reads the
      # registry, writes nothing.
      - name: Publish (dry run)
        run: node scripts/publish.js packs --dry-run

  # Only here, in release.yml itself: npm's trusted publisher names this file.
  publish:
    name: publish
    needs: [version, pack]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      # The tag and the GitHub Release.
      contents: write
      # npm trusted publishing: npm trades this token for one that may publish.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # No registry-url: it would set NODE_AUTH_TOKEN, and there is no token.
      # No pnpm, so no caching for package.json's `packageManager`.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 for `publish` and 11.21.0 for
      # `dist-tag`, which moves `latest`. Node 24 ships 11.19.
      - name: An npm that can set dist-tags with OIDC
        run: |
          npm install --global npm@11
          version=$(npm --version)
          echo "npm $version"
          node -e "const [a, b] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && b >= 21) ? 0 : 1)" "$version" \
            || { echo "::error::npm $version cannot set dist-tags with OIDC"; exit 1; }
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: packs
      # Order, waiting for tarballs, skipping what is published, dist-tags: see its top.
      - name: Publish to npm
        run: node scripts/publish.js packs
      - name: Tag v${{ needs.version.outputs.version }}
        env:
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
            at=$(git rev-parse "$TAG^{commit}")
            [ "$at" = "$GITHUB_SHA" ] || { echo "::error::$TAG is $at already, not $GITHUB_SHA"; exit 1; }
            echo "$TAG is there already."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG is there already."
            exit 0
          fi
          node scripts/release.js notes "$VERSION" > notes.md
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" packs/*.tgz --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
