name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # No display is needed: every test is headless, and screenshots render on the CPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build-time headers for the windowing and font crates. Nothing here is used at test time.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      # A cold build of Stylo, wgpu and Vello takes several minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/host

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
